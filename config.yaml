baseURL: https://www.internozero.it
languageCode: it
title: Senza classi! Senza orari! Il tuo inglese al lavoro!

theme: 'hugo-fresh'
# Enable robots.txt generation
enableRobotsTXT: true
# Put in your tracking code without quotes like this: UA-XXX for universal tracking or G-XXX analytics v4 tracking
googleAnalytics: AW-17075018039
# Disables warnings
disableKinds:
- taxonomy
markup:
  goldmark:
    renderer:
      unsafe: true # Allows you to write raw html in your md files
 
params:
  # Open graph allows easy social sharing. If you don't want it you can set it to false or just delete the variable
  openGraph: false
  # Used as meta data; describe your site to make Google Bots happy
  description:
  # Preloader ensures images are loaded before displaying to the user. If you don't want it uncomment to set it to false
  preloader: false
  navbarlogo:
  # Logo (from static/images/logos/___)
    image: logos/internozero1.svg
    link: /
    # Default width/height. Uncomment if you need to change
    # width: 500
    # height: 228
  font:
    name: "Open Sans"
    sizes: [400,400]
  hero:
    # Hero background image (from static/images/_____)
    image: gallery/campocorto.jpg
    # Main hero title
    title:  The Full English Immersion Hub
    # Hero subtitle (optional)
    subtitle: Non studiare l'inglese, lavoraci dentro!
    # Hero subsubtitle (optional)
    subsubtitle: 
      - A 100 metri dalla fermata del BUS e 150 metri dalla Coop di via Palagetta
    # Button text
    buttontext: Scopri
    buttonlink: "#section2a"
    # Second button text
    buttontext2: Confronta
    buttonlink2: "#section12"
    # Third button text
    buttontext3: Prenota
    buttonlink3: "#section6"
    # Hero images for carousel (from static/images/gallery/_____)
    # Urls and image names are inside the hero-body template because it is javascript

