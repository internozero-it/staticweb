      - "- Ingressi Nominali: 1 ingresso a persona, non trasferibile"
      url: "#section6"
      buttonText: "Prenota Ora!"
    - title: Settimanale da 160€ + IVA
      icon: calendar-week
      list:
      - "- 5 giorni consecutivi (Lun-Ven)"
      - "- Postazione: booked 4 the Week!"
      - "- 1 ingresso giornaliero extra da usare con chi vuoi e quando vuoi"
      - "- Ingressi parzialmente nominali per aziende: 1 dipendente a settimana"
      url: "#section6"
      buttonText: "Prenota Ora!"
    - title: Mensile da 500€ + IVA 
      icon: calendar-month
      list:
      - "- 4 settimane consecutive (Lun-Ven)"
      - "- Postazione: booked 4 the Month!"
      - "- 1 ingresso giornaliero extra a settimana da usare con chi vuoie quando vuoi"
      - "- Ingressi flessibili: manda i tuoi dipendenti quando vuoi, senza vincoli di giorni"
      url: "#section6"
      buttonText: "Prenota Ora!"
  section2:
    title: Resta Connesso!
    title2: Iscriviti alla Newsletter...
    subtitle: ...per ricevere aggiornamenti su attività ed eventi!
    buttonText: "Eventi esclusivi ti aspettano!"
  section2a:
    title2a: "Entra in un Augmented Office!"
    subtitle2a: E impara mentre resti produttivo!
    text2a: 
      - "**Internozero è il primo Full English Immersion Hub dove professionisti e manager di diverse aziende lavorano affiancati in un ambiente 100% English-speaking.**"
      - " - **Lezioni Destrutturate:** vivremo in scenari realistici, parleremo di progetti, email, presentazioni e di 'Water Cooler Talk.' Niente lezioni tradizionali e niente compiti a casa!"
      - " - **Parlare Corporate:** impara a riconoscere le sfumature e le espressioni usate durante le riunioni e negli uffici internazionali."
      - " - **Acquisisci Sicurezza:**  -*Per parlare bene inglese devi andare in Inghilterra!*- Dicevano... Con InternoZero puoi farlo senza muoverti dalla provincia di Firenze!"
      - " - **Feedback Istantaneo:** grazie ai tutor sempre in ufficio per darti un feedback su errori di pronuncia, grammatica, ed aiutarti ad arricchire il tuo vocabolario."
      - " - **Batti L'Ansia:** durante i Daily Corporate Touchpoint e con lo 1-on-1 Daily Corporate Coffee comincia a parlare Inglese in pubblico."
  section5:
    title: Vuoi sapere come funziona InternoZero?
    subtitle: Contattaci, vieni a trovarci, scopri il nostro spazio!
    buttonText: Send Message
    action: https://formspree.io/f/meogevzz
    method: POST
  section6:
    title: Comincia Subito!
    subtitle: Seleziona il tipo di ingresso e quando vorresti cominciare, poi ti richiamiamo noi!
    buttonText: Send Message
    action: https://formspree.io/f/mnnddlvz
    method: POST
